name: Temporary Issue 213 Docs Cleanup

on:
  push:
    branches:
      - docs/213-milestone-versioning

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/213-milestone-versioning
          fetch-depth: 0
      - name: Remove duplicated evidence entries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/README.md')
          text = p.read_text()
          for line in (
              '- [`milestones/M3-seeded-run-validation.md`](milestones/M3-seeded-run-validation.md)\n',
              '- [`milestones/M4-run-pacing-validation.md`](milestones/M4-run-pacing-validation.md)\n',
          ):
              if text.count(line) != 1:
                  raise SystemExit(f'expected one duplicate entry for {line.strip()!r}')
              text = text.replace(line, '', 1)
          p.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/README.md
          git diff --cached --check
          git commit -m "docs: keep milestone history list focused"
          git push origin HEAD:docs/213-milestone-versioning
