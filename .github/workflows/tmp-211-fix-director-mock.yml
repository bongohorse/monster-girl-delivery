name: Temporary Issue 211 Director Mock Patch

on:
  push:
    branches:
      - fix/211-high-dpi-camera-origin

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/211-high-dpi-camera-origin
          fetch-depth: 0
      - name: Update camera mock
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/game/scenes/FoundationDirectorMode.test.ts')
          text = p.read_text()
          old = """      main: {\n        setBackgroundColor: () => undefined,\n        setZoom: () => undefined,\n      },"""
          new = """      main: {\n        setBackgroundColor: () => undefined,\n        setOrigin() {\n          return this;\n        },\n        setZoom() {\n          return this;\n        },\n      },"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one camera mock block, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/game/scenes/FoundationDirectorMode.test.ts
          git commit -m "test(render): support logical camera origin in Director harness"
          git push origin HEAD:fix/211-high-dpi-camera-origin
