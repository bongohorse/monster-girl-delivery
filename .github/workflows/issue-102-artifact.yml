name: Issue 102 browser artifact

on:
  push:
    branches:
      - feature/102-high-dpi-rendering

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: issue-102-browser-dist
          path: dist
          retention-days: 1
