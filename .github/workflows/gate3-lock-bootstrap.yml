name: Gate 3 lock bootstrap

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/gate3-lock-bootstrap.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Refresh Bun lockfile
        run: bun install

      - name: Commit lockfile if needed
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "test: lock Stryker pilot dependencies"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
