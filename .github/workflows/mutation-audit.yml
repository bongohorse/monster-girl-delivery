name: Collectibles mutation audit

on:
  workflow_dispatch:
  # Gate 3 validation only. Remove this PR trigger before merge.
  pull_request:
    paths:
      - '.github/workflows/mutation-audit.yml'
      - 'package.json'
      - 'bun.lock'
      - 'stryker.collectibles.config.mjs'
      - 'scripts/collectibles-mutation-command.mjs'
      - 'src/systems/PrototypeCollectibles.ts'
      - 'tests/systems/PrototypeCollectibles*.test.ts'
      - 'docs/TEST_QUALITY*'

permissions:
  contents: read

jobs:
  mutation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p reports/mutation/collectibles

      - name: Verify focused baseline
        run: |
          node ./node_modules/vitest/vitest.mjs run \
            tests/systems/PrototypeCollectiblesAuthorityAudit.test.ts \
            tests/systems/PrototypeCollectibles.test.ts \
            --reporter=json \
            --outputFile=reports/mutation/collectibles/baseline.json

      - name: Record tool versions
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const version = (name) => JSON.parse(readFileSync('node_modules/' + name + '/package.json', 'utf8')).version;
          const baseline = JSON.parse(readFileSync('reports/mutation/collectibles/baseline.json', 'utf8'));
          const expectedTests = baseline.testResults.flatMap((suite) => suite.assertionResults).length;
          writeFileSync('reports/mutation/collectibles/run-metadata.json', JSON.stringify({
            commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            workflowRunId: process.env.GITHUB_RUN_ID,
            node: process.version,
            bun: execFileSync('bun', ['--version'], { encoding: 'utf8' }).trim(),
            vitest: version('vitest'),
            strykerCore: version('@stryker-mutator/core'),
            expectedTests,
          }, null, 2) + '\n');
          NODE

      - name: Run mutation pilot 1
        env:
          MGD_MUTATION_EVIDENCE_DIR: ${{ github.workspace }}/reports/mutation/collectibles/evidence-1
          MGD_MUTATION_BASELINE_REPORT: ${{ github.workspace }}/reports/mutation/collectibles/baseline.json
        run: |
          rm -f reports/mutation/collectibles/mutation.json
          set -o pipefail
          bun run test:mutation:collectibles 2>&1 | tee reports/mutation/collectibles/pilot-1.log
          cp reports/mutation/collectibles/mutation.json reports/mutation/collectibles/run-1.json

      - name: Run mutation pilot 2
        env:
          MGD_MUTATION_EVIDENCE_DIR: ${{ github.workspace }}/reports/mutation/collectibles/evidence-2
          MGD_MUTATION_BASELINE_REPORT: ${{ github.workspace }}/reports/mutation/collectibles/baseline.json
        run: |
          rm -f reports/mutation/collectibles/mutation.json
          bun run test:mutation:collectibles
          cp reports/mutation/collectibles/mutation.json reports/mutation/collectibles/run-2.json

      - name: Compare verdict stability and summarize states
        shell: bash
        run: |
          node - <<'NODE'
          import fs from 'node:fs';

          const load = (path) => JSON.parse(fs.readFileSync(path, 'utf8'));
          const flatten = (report) => {
            const rows = [];
            for (const [fileName, file] of Object.entries(report.files ?? {})) {
              for (const mutant of file.mutants ?? []) {
                rows.push({
                  key: fileName + ':' + mutant.id,
                  fileName,
                  id: String(mutant.id),
                  mutatorName: mutant.mutatorName ?? null,
                  replacement: mutant.replacement ?? null,
                  status: mutant.status,
                  statusReason: mutant.statusReason ?? null,
                  location: mutant.location ?? null,
                  killedBy: mutant.killedBy ?? [],
                  coveredBy: mutant.coveredBy ?? [],
                });
              }
            }
            rows.sort((a, b) => a.key.localeCompare(b.key));
            return rows;
          };

          const baseline = load('reports/mutation/collectibles/baseline.json');
          const expectedTests = baseline.testResults.flatMap((suite) => suite.assertionResults).length;
          if (expectedTests <= 0) throw new Error('Focused baseline must contain tests.');

          const first = flatten(load('reports/mutation/collectibles/run-1.json'));
          const second = flatten(load('reports/mutation/collectibles/run-2.json'));
          if (first.length === 0 || second.length === 0) {
            throw new Error('Mutation report must contain mutants.');
          }
          const terminalStates = new Set(['Killed', 'Survived', 'NoCoverage', 'Timeout', 'CompileError', 'RuntimeError', 'Ignored']);
          for (const row of [...first, ...second]) {
            if (!terminalStates.has(row.status)) throw new Error('Incomplete mutant: ' + row.key);
          }
          for (const [run, rows] of [[1, first], [2, second]]) {
            for (const row of rows) {
              if (!['Killed', 'Survived'].includes(row.status)) continue;
              const evidence = load('reports/mutation/collectibles/evidence-' + run + '/' + row.id + '.evidence.json');
              if (
                evidence.expected !== expectedTests ||
                evidence.completed !== expectedTests ||
                !['TestFailure', 'Passed'].includes(evidence.kind)
              ) {
                throw new Error('Unusable test execution for mutant ' + row.id + ': ' + evidence.kind);
              }
              if ((row.status === 'Survived') !== (evidence.kind === 'Passed')) {
                throw new Error('Command verdict disagrees with Vitest evidence: ' + row.id);
              }
            }
          }
          const firstMap = new Map(first.map((row) => [row.key, row]));
          const secondMap = new Map(second.map((row) => [row.key, row]));
          const keys = [...new Set([...firstMap.keys(), ...secondMap.keys()])].sort();

          const changes = [];
          for (const key of keys) {
            const a = firstMap.get(key);
            const b = secondMap.get(key);
            if (!a || !b || a.status !== b.status || a.mutatorName !== b.mutatorName || a.replacement !== b.replacement || JSON.stringify(a.location) !== JSON.stringify(b.location)) {
              changes.push({
                key,
                first: a?.status ?? 'missing',
                second: b?.status ?? 'missing',
              });
            }
          }

          const counts = (rows) => {
            const result = Object.fromEntries([...terminalStates].map((state) => [state, 0]));
            for (const row of rows) result[row.status] = (result[row.status] ?? 0) + 1;
            return result;
          };

          const summary = {
            commit: process.env.GITHUB_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            node: process.version,
            runtime: process.release.name,
            expectedTests,
            mutantCountRun1: first.length,
            mutantCountRun2: second.length,
            statusCountsRun1: counts(first),
            statusCountsRun2: counts(second),
            verdictChanges: changes,
          };

          fs.writeFileSync(
            'reports/mutation/collectibles/stability-summary.json',
            JSON.stringify(summary, null, 2) + '\n',
          );
          fs.writeFileSync(
            'reports/mutation/collectibles/mutants-run-1.normalized.json',
            JSON.stringify(first, null, 2) + '\n',
          );

          console.log(JSON.stringify(summary, null, 2));
          if (changes.length > 0) {
            console.error('Mutation verdicts were not stable across the two identical pilot runs.');
            process.exit(1);
          }
          NODE

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collectibles-mutation-${{ github.sha }}
          path: reports/mutation/collectibles/
          if-no-files-found: error
          retention-days: 14
