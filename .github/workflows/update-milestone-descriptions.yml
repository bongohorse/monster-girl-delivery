name: One-time milestone description update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-milestone-descriptions.yml

permissions:
  contents: read
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Update milestone descriptions
        shell: bash
        run: |
          set -euo pipefail

          update_milestone() {
            local number="$1"
            local description="$2"
            gh api --method PATCH "repos/$REPO/milestones/$number" \
              -f description="$description" \
              >/dev/null
          }

          update_milestone 1 "Version: 0.0.0 · Closeout: https://github.com/$REPO/blob/main/docs/milestones/M0-foundation.md"
          update_milestone 2 "Version: 0.1.0 · Closeout: https://github.com/$REPO/blob/main/docs/milestones/M1-flight-prototype.md · Evidence: https://github.com/$REPO/blob/main/docs/milestones/M1-device-report.md"
          update_milestone 3 "Version: 0.2.0 · Closeout: https://github.com/$REPO/blob/main/docs/milestones/M2-horizontal-run-first-hazard.md"
          update_milestone 4 "Version: 0.3.0 · Closeout: https://github.com/$REPO/blob/main/docs/milestones/M3-seeded-generation-fairness.md · Evidence: https://github.com/$REPO/blob/main/docs/milestones/M3-seeded-run-validation.md"
          update_milestone 5 "Version: 0.4.0 · Closeout: https://github.com/$REPO/blob/main/docs/milestones/M4-run-pacing-hazard-language.md · Evidence: https://github.com/$REPO/blob/main/docs/milestones/M4-run-pacing-validation.md"
          update_milestone 6 "Target version: 0.5.0 · Planning: https://github.com/$REPO/issues/197 · M6 gameplay gate: https://github.com/$REPO/issues/270"

          echo "Milestone descriptions updated."
