name: Deploy web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-deploy.yml'
      - 'index.html'
      - 'public/**'
      - 'assets/**'
      - 'scripts/assets/**'
      - 'src/**'
      - 'workshop/**'
      - 'scripts/workshop/**'
      - 'scripts/browser/**'
      - 'tests/workshop/**'
      - 'docs/**'
      - '*.md'
      - 'tsconfig.workshop.json'
      - 'vite/**'
      - 'scripts/verify-web-package.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
  pull_request:
    paths:
      - '.github/workflows/pages-deploy.yml'
      - 'index.html'
      - 'public/**'
      - 'assets/**'
      - 'scripts/assets/**'
      - 'src/**'
      - 'workshop/**'
      - 'scripts/workshop/**'
      - 'scripts/browser/**'
      - 'tests/workshop/**'
      - 'docs/**'
      - '*.md'
      - 'tsconfig.workshop.json'
      - 'vite/**'
      - 'scripts/verify-web-package.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production web app
        run: bun run build

      # Source-image exclusion belongs to game dist; Workshop galleries intentionally show originals.
      - name: Verify production PWA package
        run: |
          node scripts/verify-web-package.mjs dist
          bun scripts/assets/check-package.ts dist

      - name: Check Workshop types and historical catalog
        run: |
          bun run workshop:typecheck
          bun run workshop:check

      - name: Build independent Workshop
        run: bun run workshop:build

      - name: Assemble game and Workshop Pages package
        run: |
          bun run pages:assemble
          node scripts/verify-web-package.mjs dist-pages
          diff --recursive --brief --exclude=workshop dist dist-pages

      - name: Check composed Pages in real Chromium
        env:
          MGD_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export MGD_CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          bun run pages:smoke

      - name: Upload Pages browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-browser-${{ github.sha }}
          path: reports/browser-runtime-smoke/pages/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload reviewable Pages package
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pages-preview-${{ github.sha }}
          path: dist-pages/
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require Actions publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [ "$BUILD_TYPE" != workflow ]; then
            echo '::error::Set Settings → Pages → Source to GitHub Actions. Branch/Jekyll publishing must be disabled.'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
