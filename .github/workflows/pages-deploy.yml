name: Deploy web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-deploy.yml'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'vite/**'
      - 'scripts/verify-web-package.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
  pull_request:
    paths:
      - '.github/workflows/pages-deploy.yml'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'vite/**'
      - 'scripts/verify-web-package.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production web app
        run: bun run build

      - name: Verify production PWA package
        run: node scripts/verify-web-package.mjs dist

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require Actions publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [ "$BUILD_TYPE" != workflow ]; then
            echo '::error::Set Settings → Pages → Source to GitHub Actions. Branch/Jekyll publishing must be disabled.'
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
