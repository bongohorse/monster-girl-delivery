name: Temporary Issue 211 Patch

on:
  push:
    branches:
      - fix/211-high-dpi-camera-origin

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/211-high-dpi-camera-origin
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply focused camera-origin fix and regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(text.replace(old, new))

          replace_exact(
              'src/game/scenes/Foundation.ts',
              'this.cameras.main.setZoom(renderViewport.renderScale);',
              'this.cameras.main.setOrigin(0, 0).setZoom(renderViewport.renderScale);',
              2,
          )
          replace_exact(
              'src/game/scenes/Preloader.ts',
              'this.cameras.main.setZoom(viewport.renderScale);',
              'this.cameras.main.setOrigin(0, 0).setZoom(viewport.renderScale);',
              2,
          )

          replace_exact(
              'tests/game/scenes/Foundation.test.ts',
              '  const cameraResize = vi.fn();\n  const cameraSetZoom = vi.fn();',
              "  const cameraResize = vi.fn();\n  const cameraSetZoom = vi.fn();\n  const cameraMain = { setOrigin: vi.fn(), setZoom: cameraSetZoom };\n  cameraMain.setOrigin.mockReturnValue(cameraMain);",
              1,
          )
          replace_exact(
              'tests/game/scenes/Foundation.test.ts',
              "  Reflect.set(foundation, 'cameras', {\n    main: { setZoom: cameraSetZoom },\n    resize: cameraResize,\n  });",
              "  Reflect.set(foundation, 'cameras', {\n    main: cameraMain,\n    resize: cameraResize,\n  });",
              1,
          )
          replace_exact(
              'tests/game/scenes/Foundation.test.ts',
              '    cameraResize,\n    cameraSetZoom,',
              '    cameraResize,\n    cameraSetOrigin: cameraMain.setOrigin,\n    cameraSetZoom,',
              1,
          )
          replace_exact(
              'tests/game/scenes/Foundation.test.ts',
              "    const { cameraResize, cameraSetZoom, foundation, playerPresentation, viewportService } =\n      createFoundationHarness();",
              "    const {\n      cameraResize,\n      cameraSetOrigin,\n      cameraSetZoom,\n      foundation,\n      playerPresentation,\n      viewportService,\n    } = createFoundationHarness();",
              1,
          )
          replace_exact(
              'tests/game/scenes/Foundation.test.ts',
              '    expect(cameraResize).toHaveBeenLastCalledWith(1600, 1200);\n    expect(cameraSetZoom).toHaveBeenLastCalledWith(2);',
              '    expect(cameraResize).toHaveBeenLastCalledWith(1600, 1200);\n    expect(cameraSetOrigin).toHaveBeenLastCalledWith(0, 0);\n    expect(cameraSetZoom).toHaveBeenLastCalledWith(2);',
              1,
          )

          replace_exact(
              'tests/game/scenes/Preloader.test.ts',
              '  const cameraResize = vi.fn();\n  const cameraSetZoom = vi.fn();',
              "  const cameraResize = vi.fn();\n  const cameraSetZoom = vi.fn();\n  const cameraMain = { setOrigin: vi.fn(), setZoom: cameraSetZoom };\n  cameraMain.setOrigin.mockReturnValue(cameraMain);",
              1,
          )
          replace_exact(
              'tests/game/scenes/Preloader.test.ts',
              "  Reflect.set(preloader, 'cameras', {\n    main: { setZoom: cameraSetZoom },\n    resize: cameraResize,\n  });",
              "  Reflect.set(preloader, 'cameras', {\n    main: cameraMain,\n    resize: cameraResize,\n  });",
              1,
          )
          replace_exact(
              'tests/game/scenes/Preloader.test.ts',
              '    cameraResize,\n    cameraSetZoom,',
              '    cameraResize,\n    cameraSetOrigin: cameraMain.setOrigin,\n    cameraSetZoom,',
              1,
          )
          replace_exact(
              'tests/game/scenes/Preloader.test.ts',
              "    const { background, cameraResize, cameraSetZoom, frame, preloader } = createPreloaderHarness({",
              "    const { background, cameraResize, cameraSetOrigin, cameraSetZoom, frame, preloader } =\n      createPreloaderHarness({",
              1,
          )
          replace_exact(
              'tests/game/scenes/Preloader.test.ts',
              "      zoom: 0.5,\n    });",
              "        zoom: 0.5,\n      });",
              1,
          )
          replace_exact(
              'tests/game/scenes/Preloader.test.ts',
              '    expect(cameraSetZoom).toHaveBeenCalledExactlyOnceWith(2);\n    expect(background.setDisplaySize).toHaveBeenLastCalledWith(390, 844);',
              '    expect(cameraSetOrigin).toHaveBeenCalledExactlyOnceWith(0, 0);\n    expect(cameraSetZoom).toHaveBeenCalledExactlyOnceWith(2);\n    expect(background.setDisplaySize).toHaveBeenLastCalledWith(390, 844);',
              1,
          )
          replace_exact(
              'tests/game/scenes/Preloader.test.ts',
              '    expect(cameraResize).toHaveBeenLastCalledWith(1688, 780);\n    expect(cameraSetZoom).toHaveBeenLastCalledWith(2);',
              '    expect(cameraResize).toHaveBeenLastCalledWith(1688, 780);\n    expect(cameraSetOrigin).toHaveBeenLastCalledWith(0, 0);\n    expect(cameraSetZoom).toHaveBeenLastCalledWith(2);',
              1,
          )
          PY
      - name: Format changed files
        run: bunx biome format --write src/game/scenes/Foundation.ts src/game/scenes/Preloader.ts tests/game/scenes/Foundation.test.ts tests/game/scenes/Preloader.test.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/scenes/Foundation.ts src/game/scenes/Preloader.ts tests/game/scenes/Foundation.test.ts tests/game/scenes/Preloader.test.ts
          git commit -m "fix(render): anchor DPR cameras to logical origin"
          git push origin HEAD:fix/211-high-dpi-camera-origin
