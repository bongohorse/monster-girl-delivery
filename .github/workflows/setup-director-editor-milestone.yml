name: One-time Director Editor milestone setup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/setup-director-editor-milestone.yml

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Create Director Editor milestone and assign issues
        shell: bash
        run: |
          set -euo pipefail

          title="Director Editor — In-Game Run Editor & Gameplay Lab"
          description="Internal tooling milestone · Planning/umbrella: https://github.com/$REPO/issues/281 · 19 focused editor slices with Director acceptance after each child"

          number="$(
            gh api "repos/$REPO/milestones?state=all&per_page=100" \
              --paginate \
              --jq ".[] | select(.title == \"$title\") | .number" \
              | head -n 1
          )"

          if [[ -z "$number" ]]; then
            number="$(
              gh api --method POST "repos/$REPO/milestones" \
                -f title="$title" \
                -f description="$description" \
                -f state="open" \
                --jq .number
            )"
          else
            gh api --method PATCH "repos/$REPO/milestones/$number" \
              -f title="$title" \
              -f description="$description" \
              -f state="open" \
              >/dev/null
          fi

          for issue_number in \
            281 282 283 284 285 286 287 288 289 290 \
            291 292 293 294 295 296 297 300 301 302
          do
            gh api --method PATCH "repos/$REPO/issues/$issue_number" \
              -F milestone="$number" \
              >/dev/null
          done

          open_count="$(gh api "repos/$REPO/milestones/$number" --jq .open_issues)"
          closed_count="$(gh api "repos/$REPO/milestones/$number" --jq .closed_issues)"

          if [[ "$open_count" != "20" || "$closed_count" != "0" ]]; then
            echo "Unexpected Director Editor milestone counts: open=$open_count closed=$closed_count" >&2
            exit 1
          fi

          echo "Director Editor milestone #$number ready: 20 open / 0 closed."
