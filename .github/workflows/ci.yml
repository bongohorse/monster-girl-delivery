name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run ci:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Temporary Gate 1 evidence step for #371. Remove before merge after baseline capture.
      - name: Coverage baseline (Gate 1)
        run: bun run test:coverage

      - name: Build
        run: bun run build
