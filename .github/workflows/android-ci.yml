name: Android CI

on:
  pull_request:
    paths:
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'vite/**'
      - 'scripts/android-release-version.mjs'
      - 'scripts/verify-web-package.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/android-release.yml'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'vite/**'
      - 'scripts/android-release-version.mjs'
      - 'scripts/verify-web-package.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MGD_ANDROID_DIRECTOR_BUILD: '1'
      MGD_ANDROID_SIGNING_MODE: ephemeral-debug
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Record checked-out build identity
        id: build_identity
        shell: bash
        run: |
          BUILT_SHA="$(git rev-parse HEAD)"
          echo "BUILT_SHA=$BUILT_SHA" >> "$GITHUB_ENV"
          echo "built_sha=$BUILT_SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_HEAD_SHA" ]; then
            echo "PR_HEAD_SHA=$PR_HEAD_SHA"
          else
            echo 'PR_HEAD_SHA=<none>'
          fi
          echo "BUILT_SHA=$BUILT_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify Android release version mapping
        shell: bash
        run: |
          PACKAGE_VERSION="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          node scripts/android-release-version.mjs "v${PACKAGE_VERSION}"

      - name: Sync production web build into Android
        run: bun run android:sync

      - name: Verify bundled production PWA
        run: node scripts/verify-web-package.mjs android/app/src/main/assets/public

      - name: Verify MGD Android identity
        run: |
          grep -F "appId: 'com.bongohorse.monstergirldelivery'" capacitor.config.ts
          grep -F "appName: 'MGD'" capacitor.config.ts
          grep -F "appendUserAgent: 'MGD-Capacitor/1'" capacitor.config.ts
          grep -F 'android:screenOrientation="sensorLandscape"' android/app/src/main/AndroidManifest.xml
          grep -F 'applicationId "com.bongohorse.monstergirldelivery"' android/app/build.gradle

      - name: Prepare optional stable test signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          MGD_ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.MGD_ANDROID_TEST_KEYSTORE_BASE64 }}
          MGD_ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.MGD_ANDROID_TEST_KEYSTORE_PASSWORD }}
          MGD_ANDROID_TEST_KEY_ALIAS: ${{ secrets.MGD_ANDROID_TEST_KEY_ALIAS }}
          MGD_ANDROID_TEST_KEY_PASSWORD: ${{ secrets.MGD_ANDROID_TEST_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$MGD_ANDROID_TEST_KEYSTORE_BASE64$MGD_ANDROID_TEST_KEYSTORE_PASSWORD$MGD_ANDROID_TEST_KEY_ALIAS$MGD_ANDROID_TEST_KEY_PASSWORD" ]; then
            exit 0
          fi
          if [ -n "$MGD_ANDROID_TEST_KEYSTORE_BASE64" ] && \
             [ -n "$MGD_ANDROID_TEST_KEYSTORE_PASSWORD" ] && \
             [ -n "$MGD_ANDROID_TEST_KEY_ALIAS" ] && \
             [ -n "$MGD_ANDROID_TEST_KEY_PASSWORD" ]; then
            printf '%s' "$MGD_ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mgd-test.keystore"
            echo "MGD_ANDROID_TEST_KEYSTORE_FILE=$RUNNER_TEMP/mgd-test.keystore" >> "$GITHUB_ENV"
            echo 'MGD_ANDROID_SIGNING_MODE=stable-test' >> "$GITHUB_ENV"
          else
            echo '::error::Stable test signing requires all four MGD_ANDROID_TEST_* secrets; refusing to silently change the signing key.'
            exit 1
          fi

      - name: Compile tests and assemble debug APK
        working-directory: android
        env:
          MGD_ANDROID_TEST_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.MGD_ANDROID_TEST_KEYSTORE_PASSWORD || '' }}
          MGD_ANDROID_TEST_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.MGD_ANDROID_TEST_KEY_ALIAS || '' }}
          MGD_ANDROID_TEST_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.MGD_ANDROID_TEST_KEY_PASSWORD || '' }}
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Stage commit-addressed APK evidence
        shell: bash
        run: |
          SHORT_BUILT_SHA="${BUILT_SHA:0:12}"
          APK_NAME="mgd-debug-${SHORT_BUILT_SHA}.apk"
          APK_SOURCE='android/app/build/outputs/apk/debug/app-debug.apk'
          APK_TARGET="reports/android/${APK_NAME}"
          mkdir -p reports/android
          cp "$APK_SOURCE" "$APK_TARGET"
          (
            cd reports/android
            sha256sum "$APK_NAME" > SHA256SUMS.txt
          )

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo 'Android apksigner was not found.' >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK_TARGET" \
            > reports/android/apk-signature.txt

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const builtCommit = process.env.BUILT_SHA;
          if (!builtCommit) {
            throw new Error('BUILT_SHA is required for Android artifact identity.');
          }
          const prHeadCommit = process.env.PR_HEAD_SHA || null;
          writeFileSync(
            'reports/android/build-info.json',
            `${JSON.stringify(
              {
                builtCommit,
                shortBuiltCommit: builtCommit.slice(0, 12),
                prHeadCommit,
                workflowEventSha: process.env.GITHUB_SHA,
                workflowRef: process.env.GITHUB_REF,
                workflowEventName: process.env.GITHUB_EVENT_NAME,
                workflowRunId: process.env.GITHUB_RUN_ID,
                workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
                signingMode: process.env.MGD_ANDROID_SIGNING_MODE,
                applicationId: 'com.bongohorse.monstergirldelivery',
                artifactType: 'debug-apk',
                java: '25',
                capacitor: JSON.parse(readFileSync('node_modules/@capacitor/android/package.json', 'utf8')).version,
              },
              null,
              2,
            )}\n`,
          );
          NODE

      - name: Upload Android test APK
        uses: actions/upload-artifact@v7
        with:
          name: mgd-android-debug-${{ steps.build_identity.outputs.built_sha }}
          path: reports/android/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary test keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mgd-test.keystore"
