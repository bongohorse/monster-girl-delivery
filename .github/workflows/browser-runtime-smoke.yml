name: Browser runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/browser-runtime-smoke.yml'
      - 'index.html'
      - 'public/**'
      - 'src/main.ts'
      - 'src/core/**'
      - 'src/game/**'
      - 'src/input/**'
      - 'src/entities/**'
      - 'src/devtools/**'
      - 'tests/browser/**'
      - 'vite/**'
      - 'package.json'
      - 'bun.lock'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/browser-runtime-smoke.yml'
      - 'index.html'
      - 'public/**'
      - 'src/main.ts'
      - 'src/core/**'
      - 'src/game/**'
      - 'src/input/**'
      - 'src/entities/**'
      - 'src/devtools/**'
      - 'tests/browser/**'
      - 'vite/**'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Prepare evidence directory
        run: mkdir -p reports/browser-runtime-smoke

      - name: Record Chrome version
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No supported Chrome/Chromium binary found on the runner." >&2
            exit 1
          fi
          "$CHROME" --version | tee reports/browser-runtime-smoke/chrome-version.txt
          printf '%s\n' "$CHROME" > reports/browser-runtime-smoke/chrome-path.txt

      - name: Start Vite browser-smoke server
        run: |
          bunx vite \
            --host 127.0.0.1 \
            --port 4173 \
            --strictPort \
            --config vite/config.dev.mjs \
            > reports/browser-runtime-smoke/vite.log 2>&1 &
          echo $! > reports/browser-runtime-smoke/vite.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:4173/tests/browser/runtime-smoke.html \
              > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done

          cat reports/browser-runtime-smoke/vite.log >&2
          exit 1

      - name: Run root application boot smoke
        run: |
          set -o pipefail
          curl --fail --silent --show-error \
            http://127.0.0.1:4173/ \
            > reports/browser-runtime-smoke/root-source.html
          grep -F 'id="mgd-boot-screen"' reports/browser-runtime-smoke/root-source.html
          grep -F '>MGD<' reports/browser-runtime-smoke/root-source.html
          grep -F 'rel="manifest" href="./manifest.webmanifest"' reports/browser-runtime-smoke/root-source.html

          curl --fail --silent --show-error \
            http://127.0.0.1:4173/manifest.webmanifest \
            > reports/browser-runtime-smoke/manifest.webmanifest
          curl --fail --silent --show-error \
            http://127.0.0.1:4173/icons/mgd-192.png \
            > reports/browser-runtime-smoke/mgd-192.png
          curl --fail --silent --show-error \
            http://127.0.0.1:4173/icons/mgd-512.png \
            > reports/browser-runtime-smoke/mgd-512.png

          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(
            readFileSync('reports/browser-runtime-smoke/manifest.webmanifest', 'utf8'),
          );
          const fail = (message) => {
            console.error(message);
            process.exit(1);
          };

          if (manifest.name !== 'Monster Girl Delivery' || manifest.short_name !== 'MGD') {
            fail('Unexpected PWA app identity.');
          }
          if (manifest.id !== './' || manifest.start_url !== './' || manifest.scope !== './') {
            fail('PWA id/start_url/scope must remain deployment-relative.');
          }
          if (manifest.display !== 'fullscreen') {
            fail('PWA must request fullscreen display.');
          }
          if (
            !Array.isArray(manifest.display_override) ||
            manifest.display_override[0] !== 'fullscreen' ||
            !manifest.display_override.includes('standalone')
          ) {
            fail('PWA display fallback must include fullscreen then standalone.');
          }
          if (manifest.orientation !== 'landscape') {
            fail('PWA must request landscape orientation.');
          }
          if (manifest.prefer_related_applications !== false) {
            fail('PWA must remain directly installable from the web manifest.');
          }

          const expectedIcons = new Map([
            ['192x192', 'reports/browser-runtime-smoke/mgd-192.png'],
            ['512x512', 'reports/browser-runtime-smoke/mgd-512.png'],
          ]);
          for (const icon of manifest.icons ?? []) {
            const file = expectedIcons.get(icon.sizes);
            if (!file) continue;
            if (icon.type !== 'image/png') fail(`Unexpected icon type for ${icon.sizes}.`);
            const png = readFileSync(file);
            const signature = png.subarray(0, 8).toString('hex');
            if (signature !== '89504e470d0a1a0a') fail(`${file} is not a PNG.`);
            const width = png.readUInt32BE(16);
            const height = png.readUInt32BE(20);
            const expected = Number.parseInt(icon.sizes, 10);
            if (width !== expected || height !== expected) {
              fail(`${file} has ${width}x${height}, expected ${icon.sizes}.`);
            }
            expectedIcons.delete(icon.sizes);
          }
          if (expectedIcons.size !== 0) fail('Missing required 192x192 or 512x512 PWA icon.');
          NODE

          CHROME="$(cat reports/browser-runtime-smoke/chrome-path.txt)"
          timeout 30s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-timer-throttling \
            --disable-renderer-backgrounding \
            --use-gl=swiftshader \
            --enable-unsafe-swiftshader \
            --window-size=1024,768 \
            --virtual-time-budget=5000 \
            --run-all-compositor-stages-before-draw \
            --dump-dom \
            http://127.0.0.1:4173/ \
            > reports/browser-runtime-smoke/root-dom.html \
            2> reports/browser-runtime-smoke/root-chrome.log

          grep -F '<canvas' reports/browser-runtime-smoke/root-dom.html
          grep -F 'data-mgd-logical-size=' reports/browser-runtime-smoke/root-dom.html
          grep -F 'data-mgd-backing-size=' reports/browser-runtime-smoke/root-dom.html
          grep -F 'data-mgd-boot-phase="ready"' reports/browser-runtime-smoke/root-dom.html
          grep -F 'data-mgd-boot-ready="true"' reports/browser-runtime-smoke/root-dom.html
          if grep -F '<div id="mgd-boot-screen"' reports/browser-runtime-smoke/root-dom.html; then
            echo 'MGD boot screen remained mounted after the first complete render.' >&2
            exit 1
          fi

      - name: Run real-browser Phaser smoke
        run: |
          set -o pipefail
          CHROME="$(cat reports/browser-runtime-smoke/chrome-path.txt)"
          timeout 45s "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-background-timer-throttling \
            --disable-renderer-backgrounding \
            --use-gl=swiftshader \
            --enable-unsafe-swiftshader \
            --window-size=1024,768 \
            --virtual-time-budget=15000 \
            --run-all-compositor-stages-before-draw \
            --dump-dom \
            http://127.0.0.1:4173/tests/browser/runtime-smoke.html \
            > reports/browser-runtime-smoke/dom.html \
            2> reports/browser-runtime-smoke/chrome.log

          cat reports/browser-runtime-smoke/dom.html
          grep -F 'data-smoke-status="passed"' reports/browser-runtime-smoke/dom.html
          grep -F '"scene":"Foundation"' reports/browser-runtime-smoke/dom.html
          grep -F '"keyboardInput":true' reports/browser-runtime-smoke/dom.html
          grep -F '"pointerInput":true' reports/browser-runtime-smoke/dom.html
          grep -F '"lifecycle":true' reports/browser-runtime-smoke/dom.html
          grep -F '"portraitResize":"360x640"' reports/browser-runtime-smoke/dom.html
          grep -F '"landscapeResize":"800x450"' reports/browser-runtime-smoke/dom.html
          grep -F '"teardown":true' reports/browser-runtime-smoke/dom.html

      - name: Stop Vite browser-smoke server
        if: always()
        run: |
          if [ -f reports/browser-runtime-smoke/vite.pid ]; then
            kill "$(cat reports/browser-runtime-smoke/vite.pid)" 2>/dev/null || true
          fi

      - name: Record smoke metadata
        if: always()
        run: |
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';

          writeFileSync(
            'reports/browser-runtime-smoke/summary.json',
            JSON.stringify(
              {
                commit: process.env.GITHUB_SHA,
                workflowRunId: process.env.GITHUB_RUN_ID,
                bun: execFileSync('bun', ['--version'], { encoding: 'utf8' }).trim(),
                node: process.version,
                fixture: '/tests/browser/runtime-smoke.html',
                authorityBoundary:
                  'browser integration smoke only; deterministic simulation authority remains in Node tests',
              },
              null,
              2,
            ) + '\n',
          );
          NODE

      - name: Upload browser-smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-runtime-smoke-${{ github.sha }}
          path: reports/browser-runtime-smoke/
          if-no-files-found: error
          retention-days: 14
