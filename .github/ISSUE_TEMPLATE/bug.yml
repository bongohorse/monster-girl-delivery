name: Bug
about: Report reproducible incorrect behavior
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, device/browser, seed/state if available.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this bug to be considered fixed?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Logs, screenshots, related Issues, or constraints.
