name: Technical task
about: Infrastructure, refactor, tooling, testing, or maintenance
title: "[Tech] "
labels: ["type:tech"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What technical outcome is required?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Current need / evidence
      description: What concrete problem, acceptance criterion, regression risk, or current workflow need justifies this work now? Link reproduction/evidence where available.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files/systems/behaviors expected to change. Keep this to one coherent reviewable outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behavior or evidence that proves completion; avoid criteria that only request a helper/class/test without an outcome.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Related work that must stay outside this Issue. Do not add speculative future work merely to fill this section.
