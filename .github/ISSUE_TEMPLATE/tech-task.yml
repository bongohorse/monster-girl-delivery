name: Technical task
about: Infrastructure, refactor, tooling, testing, or maintenance
title: "[Tech] "
labels: ["type:tech"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What technical outcome is required?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files/systems expected to change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete checks for completion.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Related work that must stay outside this Issue.
